[project]
name = "8chesstest-worker"
version = "0.1.0"
description = "8Chess fishtest worker"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Topic :: Software Development",
]
dependencies = [
    "expression-parser>=0.0.6",
    "openlock>=1.2.1",
    "requests>=2.32.4",
]

[project.urls]
Homepage = "https://github.com/EightChess-Team/8chesstest"
Repository = "https://github.com/EightChess-Team/8chesstest"
Issues = "https://github.com/EightChess-Team/8chesstest/issues"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "worker.py",
    "games.py",
    "updater.py",
    "fishtest.cfg",
    "sri.txt",
    "packages/**",
]

[tool.ruff]
target-version = "py38"
extend-exclude = ["packages"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]
